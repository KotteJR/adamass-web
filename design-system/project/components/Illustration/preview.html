<!-- @dsCard group="Infographics" height=840 width=1200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Illustration — preview</title>
<style>
  .pv { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.fig{margin:0;display:flex;flex-direction:column;gap:12px}.fig figcaption{display:flex;flex-direction:column;gap:6px}.fig .am-art-plate{aspect-ratio:4/3;display:grid;place-items:center}.fig .am-art svg{max-height:100%}
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var A = window.Adamass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' }, [
      ['iso', 'Product engineering', 'A bench. The track branches, the idea that works merges back (blue), the dead end stays dashed.'],
      ['schematic', 'Applied AI', 'Sources, the model chip, the documents it reads and the answer. The grounded path is blue.'],
      ['contour', 'Modernisation', 'Terrain. The route crosses the valley on a bridge (the chip); past it, the new path is blue.'],
      ['stack', 'Technical diligence', 'The system as four layers. One probe goes through all of them; the finding is blue.'],
      ['globe', 'AWS', 'Regions as rings, traffic as arcs lifted off the surface. Malmö is the chip.']
    ].map(function (a) {
      return h('figure', { key: a[0], className: 'fig' }, h(A.Illustration, { kind: a[0], title: a[1] }), h('figcaption', null, h(A.Label, null, a[1]), h('p', { className: 'small' }, a[2])));
    })));
</script>
</body>
</html>
