<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chip — preview</title>
<style>
  .pv { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var A = window.Adamass, h = React.createElement;
  function Demo() {
    var s = React.useState('ai'), v = s[0], set = s[1];
    return h('div', { className: 'pv-row' }, [['product','A new product'],['ai','AI in an existing product'],['aws','Cloud and AWS']].map(function (o) {
      return h(A.Chip, { key: o[0], selected: v === o[0], onClick: function () { set(o[0]); } }, o[1]);
    }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
