<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title>
<style>
  .pv { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var A = window.Adamass, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'pv-row' }, h(A.Button, { arrow: true }, 'Start a project'), h(A.Button, { variant: 'blue', arrow: true }, 'Scope your project'), h(A.Button, { variant: 'quiet' }, 'How we work'), h(A.Button, { variant: 'glass' }, 'See the work')),
    h('div', { className: 'pv-row' }, h(A.Button, { size: 'sm' }, 'Start a project'), h(A.Button, { variant: 'blue', disabled: true }, 'Copy the brief'))));
</script>
</body>
</html>
